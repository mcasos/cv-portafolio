name: Validate and deploy portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Scan compressed portfolio artifacts
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' artifacts < <(find public -type f \( -iname '*.xlsx' -o -iname '*.pbix' \) -print0)
          for artifact in "${artifacts[@]}"; do
            unzip -tqq "$artifact"
            if unzip -p "$artifact" | grep -Eaiq 'C:[/\\]Users|/Users/[^/]+/|OneDrive|Documentos[/\\]Trabajos|Documents[/\\]Works'; then
              echo "Private local path found inside $artifact" >&2
              exit 1
            fi
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
