name: Validate and deploy portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Scan compressed portfolio artifacts
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' artifacts < <(find public -type f \( -iname '*.xlsx' -o -iname '*.pbix' \) -print0)
          for artifact in "${artifacts[@]}"; do
            unzip -tqq "$artifact"
            if unzip -p "$artifact" | grep -Eaiq 'C:[/\\]Users|/Users/[^/]+/|OneDrive|Documentos[/\\]Trabajos|Documents[/\\]Works'; then
              echo "Private local path found inside $artifact" >&2
              exit 1
            fi
          done
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
